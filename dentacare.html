<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <title>DentaCare — Стоматологическая клиника</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
      :root {
        --bg: #fff;
        --surface: #fafaf8;
        --surface-2: #f3f2ee;
        --border: #e8e6e0;
        --border-strong: #d4d1c8;
        --text: #1a1d23;
        --text-muted: #6b7280;
        --text-subtle: #9ca3af;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --accent-soft: #ecfdf5;
        --accent-soother: #f0fdfa;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --warning: #d97706;
        --warning-soft: #fffbeb;
        --success: #16a34a;
        --success-soft: #f0fdf4;
        --info: #2563eb;
        --info-soft: #eff6ff;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        --radius: 10px;
        --radius-lg: 16px;
        --radius-xl: 24px;
      }
      [data-theme="dark"] {
        --bg: #0b0d10;
        --surface: #14171c;
        --surface-2: #1c2027;
        --border: #262b33;
        --border-strong: #343a44;
        --text: #e7e9ec;
        --text-muted: #9aa3ad;
        --text-subtle: #6b7280;
        --accent: #2dd4bf;
        --accent-hover: #14b8a6;
        --accent-soft: #042f2e;
        --accent-soother: #02201f;
        --danger-soft: #2a1414;
        --warning-soft: #2a1f0a;
        --success-soft: #0a2a14;
        --info-soft: #0a1a2a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 14px;
        color: var(--text);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        max-width: 100%;
        display: block;
      }
      .icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .icon-sm {
        width: 14px;
        height: 14px;
      }
      .icon-lg {
        width: 22px;
        height: 22px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: var(--radius);
        font-size: 13.5px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        transition: all 0.2s;
        white-space: nowrap;
        min-height: 44px;
      }
      .btn:hover {
        background: var(--surface-2);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-danger {
        color: var(--danger);
      }
      .btn-danger:hover {
        background: var(--danger-soft);
        border-color: var(--danger);
      }
      .btn-ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn-ghost:hover {
        background: var(--surface-2);
      }
      .btn-sm {
        padding: 7px 12px;
        font-size: 12.5px;
        min-height: 36px;
      }
      .btn-lg {
        padding: 14px 28px;
        font-size: 15px;
      }
      .btn-block {
        width: 100%;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .form-input,
      .form-select,
      .form-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        transition: all 0.2s;
        min-height: 44px;
      }
      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .form-textarea {
        resize: vertical;
        min-height: 80px;
      }
      .form-error {
        color: var(--danger);
        font-size: 12px;
        margin-top: 4px;
      }
      .card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        transition: all 0.3s;
      }
      .card:hover {
        box-shadow: var(--shadow-md);
      }
      .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .card-title {
        font-size: 14.5px;
        font-weight: 600;
      }
      .card-body {
        padding: 20px;
      }
      .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
      }
      th {
        text-align: left;
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        white-space: nowrap;
      }
      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 13.5px;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr.clickable {
        cursor: pointer;
      }
      tr.clickable:hover td {
        background: var(--surface);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 100px;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .badge-pending {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .badge-pending .badge-dot {
        background: var(--warning);
      }
      .badge-confirmed {
        background: var(--info-soft);
        color: var(--info);
      }
      .badge-confirmed .badge-dot {
        background: var(--info);
      }
      .badge-completed {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-completed .badge-dot {
        background: var(--success);
      }
      .badge-cancelled {
        background: var(--surface-2);
        color: var(--text-muted);
      }
      .badge-cancelled .badge-dot {
        background: var(--text-muted);
      }
      .badge-approved {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-rejected {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 256px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        flex-shrink: 0;
        z-index: 40;
      }
      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--accent), var(--accent-hover));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
      }
      .brand-text {
        display: flex;
        flex-direction: column;
      }
      .brand-name {
        font-weight: 700;
        font-size: 15px;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .nav {
        padding: 12px;
        flex: 1;
        overflow-y: auto;
      }
      .nav-section {
        font-size: 10.5px;
        color: var(--text-subtle);
        padding: 14px 10px 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: var(--radius);
        font-weight: 500;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.15s;
        margin-bottom: 2px;
        min-height: 44px;
      }
      .nav-item:hover {
        background: var(--surface-2);
      }
      .nav-item.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .sidebar-footer {
        padding: 16px;
        border-top: 1px solid var(--border);
      }
      .user-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: var(--radius);
      }
      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 13px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .user-info {
        flex: 1;
        min-width: 0;
      }
      .user-name {
        font-size: 13px;
        font-weight: 600;
      }
      .user-role {
        font-size: 11px;
        color: var(--text-muted);
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 64px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 30;
      }
      [data-theme="dark"] .topbar {
        background: rgba(11, 13, 16, 0.8);
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .topbar-title {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .content {
        padding: 28px;
        max-width: 1400px;
        width: 100%;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px;
        transition: all 0.2s;
      }
      .stat:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
        border-color: var(--accent);
      }
      .stat-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .stat-label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .stat-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius);
        background: var(--accent-soft);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stat-value {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal {
        background: var(--bg);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        max-width: 560px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
      }
      .modal-body {
        padding: 24px;
      }
      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        background: var(--surface);
        flex-wrap: wrap;
      }
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
        backdrop-filter: blur(4px);
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 520px;
        max-width: 100vw;
        background: var(--bg);
        box-shadow: var(--shadow-lg);
        z-index: 101;
        display: flex;
        flex-direction: column;
      }
      .drawer-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }
      .toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: calc(100vw - 48px);
      }
      .toast {
        background: var(--text);
        color: var(--bg);
        padding: 14px 18px;
        border-radius: var(--radius);
        font-size: 13.5px;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 260px;
      }
      .toast.success {
        background: var(--success);
        color: #fff;
      }
      .toast.error {
        background: var(--danger);
        color: #fff;
      }
      .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-input {
        padding: 9px 12px 9px 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        min-width: 240px;
        width: 100%;
        max-width: 300px;
      }
      .public {
        background: var(--bg);
        min-height: 100vh;
      }
      .pub-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
      }
      [data-theme="dark"] .pub-header {
        background: rgba(11, 13, 16, 0.85);
      }
      .pub-header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .pub-nav {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .pub-nav a {
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.15s;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .pub-nav a:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .pub-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .lang-selector {
        position: relative;
      }
      .lang-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        min-height: 44px;
      }
      .lang-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        min-width: 140px;
        z-index: 100;
        display: none;
        overflow: hidden;
      }
      .lang-dropdown.show {
        display: block;
      }
      .lang-option {
        padding: 10px 14px;
        font-size: 13.5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .lang-option:hover {
        background: var(--surface-2);
      }
      .lang-option.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .pub-hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          var(--accent-soother) 0%,
          var(--surface) 100%
        );
        padding: 100px 24px 120px;
      }
      .pub-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1600&q=80");
        background-size: cover;
        background-position: center;
        opacity: 0.06;
        z-index: 0;
      }
      .pub-hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 60px;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      .pub-hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 24px;
        box-shadow: var(--shadow);
      }
      .pub-hero-badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
      }
      .pub-hero h1 {
        font-size: 56px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin-bottom: 20px;
      }
      .pub-hero h1 span {
        background: linear-gradient(135deg, var(--accent), #059669);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .pub-hero p {
        font-size: 18px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 36px;
        max-width: 520px;
      }
      .pub-hero-cta {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 48px;
      }
      .pub-hero-stats {
        display: flex;
        gap: 48px;
        flex-wrap: wrap;
      }
      .pub-hero-stat-num {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .pub-hero-stat-label {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
        margin-top: 4px;
      }
      .pub-hero-visual {
        position: relative;
        aspect-ratio: 1;
        max-width: 480px;
        justify-self: end;
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
      }
      .pub-hero-visual img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pub-section {
        padding: 100px 24px;
      }
      .pub-section-alt {
        background: var(--surface);
      }
      .pub-section-inner {
        max-width: 1200px;
        margin: 0 auto;
      }
      .pub-section-head {
        text-align: center;
        margin-bottom: 60px;
      }
      .pub-section-label {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;

      function getAvailableSlots(eId, sId, dIso) {
        const e = store.state.employees.find((x) => x.id === eId);
        const s = store.state.services.find((x) => x.id === sId);
        if (!e || !s) return [];
        const d = new Date(dIso);
        const dow = d.getDay() === 0 ? 7 : d.getDay();
        if (!e.workingDays.includes(dow)) return [];
        const st = parseTime(e.workingHours.start),
          en = parseTime(e.workingHours.end),
          bs = parseTime(e.breakTime.start),
          be = parseTime(e.breakTime.end);
        const dur = s.duration,
          step = store.state.settings.slotDuration || 30;
        const dayAppts = store.state.appointments.filter(
          (a) =>
            a.employeeId === eId &&
            a.status !== "cancelled" &&
            sameDay(a.date, dIso),
        );
        const slots = [];
        for (let t = st; t + dur <= en; t += step) {
          if (t < be && t + dur > bs) continue;
          const c = dayAppts.some((a) => {
            const aE =
              a.startTime +
              (store.state.services.find((s) => s.id === a.serviceId)
                ?.duration || 30);
            return !(t + dur <= a.startTime || t >= aE);
          });
          if (!c) slots.push(t);
        }
        return slots;
      }
      function hasConflict(eId, dIso, st, dur, exId = null) {
        const e = store.state.employees.find((x) => x.id === eId);
        if (!e) return true;
        const d = new Date(dIso);
        const dow = d.getDay() === 0 ? 7 : d.getDay();
        if (!e.workingDays.includes(dow)) return true;
        const en = st + dur;
        if (
          st < parseTime(e.workingHours.start) ||
          en > parseTime(e.workingHours.end)
        )
          return true;
        const bs = parseTime(e.breakTime.start),
          be = parseTime(e.breakTime.end);
        if (st < be && en > bs) return true;
        const dayAppts = store.state.appointments.filter(
          (a) =>
            a.id !== exId &&
            a.employeeId === eId &&
            a.status !== "cancelled" &&
            sameDay(a.date, dIso),
        );
        return dayAppts.some((a) => {
          const aD =
            store.state.services.find((s) => s.id === a.serviceId)?.duration ||
            30;
          return !(en <= a.startTime || st >= a.startTime + aD);
        });
      }

      function canAccess(section) {
        const role = store.state.auth.user?.role;
        if (!role) return false;
        if (role === "admin") return true;
        if (role === "reception")
          return ["dashboard", "appointments", "patients"].includes(section);
        if (role === "doctor")
          return ["dashboard", "appointments", "patients"].includes(section);
        return false;
      }

        const role = store.state.auth.user?.role;
        const userId = store.state.auth.user?.employeeId;
        let list = [...store.state.appointments];
        if (role === "doctor" && userId) {
          list = list.filter((a) => a.employeeId === userId);
        }
        return list;
      }
      function getFilteredCustomers() {
        const role = store.state.auth.user?.role;
        const userId = store.state.auth.user?.employeeId;
        if (role === "doctor" && userId) {
          const custIds = [
            ...new Set(
              store.state.appointments
                .filter((a) => a.employeeId === userId)
                .map((a) => a.customerId),
            ),
          ];
          return store.state.customers.filter((c) => custIds.includes(c.id));
        }
        return store.state.customers;
      }

      function renderReviewForm() {

        return `<div class="review-form"><h3 style="margin-bottom:16px;display:flex;align-items:center;gap:8px">${ICONS.messageCircle}<span>${t("rev_write")}</span></h3><div class="form-group"><label class="form-label">${t("rev_your_name")} *</label><input class="form-input" id="rev-name" value="${escapeHtml(reviewForm.name)}" oninput="reviewForm.name=this.value"/></div><div class="form-group"><label class="form-label">${t("rev_your_rating")} *</label><div class="star-rating" id="star-rating">${[1, 2, 3, 4, 5].map((i) => `<span class="${i <= reviewForm.rating ? "active" : ""}" onclick="reviewForm.rating=${i};render()">${ICONS.star.replace('width="16"', 'width="28"').replace('height="16"', 'height="28"')}</span>`).join("")}</div></div><div class="form-group"><label class="form-label">${t("rev_your_text")} *</label><textarea class="form-textarea" id="rev-text" oninput="reviewForm.text=this.value">${escapeHtml(reviewForm.text)}</textarea></div><div id="rev-errors"></div><button class="btn btn-primary" onclick="submitReview()">${ICONS.check}<span>${t("rev_submit")}</span></button><div style="margin-top:12px;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">${ICONS.clock}<span>${t("rev_pending_notice")}</span></div></div>`;

      function submitReview() {
        const err = document.getElementById("rev-errors");
        if (!reviewForm.name.trim() || !reviewForm.text.trim()) {
          err.innerHTML = `<div class="form-error">${t("required")}</div>`;
          return;

            id: uid(),
            name: reviewForm.name.trim(),
            rating: reviewForm.rating,
            text: reviewForm.text.trim(),
            date: new Date().toISOString(),
            status: "pending",
            avatar: "",
          });
        });
        reviewForm.submitted = true;
        render();

      let bookingState = {
        step: 1,
        serviceId: null,
        employeeId: null,
        date: null,
        startTime: null,
        name: "",
        phone: "",
        notes: "",
        ref: null,
        errors: {},
        _rescheduleId: null,
      };
      function renderBooking() {
        const steps = [
          t("book_step_1"),
          t("book_step_2"),
          t("book_step_3"),
          t("book_step_4"),
          t("book_step_5"),
        ];
        let c = "";
        if (bookingState.ref) c = renderBookingConfirmation();
        else if (bookingState.step === 1) c = renderBookingStep1();
        else if (bookingState.step === 2) c = renderBookingStep2();
        else if (bookingState.step === 3) c = renderBookingStep3();
        else if (bookingState.step === 4) c = renderBookingStep4();
        return `<div style="background:var(--surface);min-height:100vh;padding-bottom:60px"><div style="background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px"><div style="max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center"><div class="brand" onclick="router.navigate('public','home')" style="cursor:pointer"><div class="brand-mark">${ICONS.tooth}</div><div class="brand-text"><div class="brand-name">${t("site_name")}</div><div class="brand-sub">${t("book_title")}</div></div></div><button class="btn btn-sm" onclick="router.navigate('public','home')">${t("book_back")}</button></div></div><div class="booking-wrap"><div class="booking-steps">${steps.map((s, i) => `<div class="booking-step ${bookingState.step === i + 1 ? "active" : ""} ${bookingState.step > i + 1 ? "done" : ""}"><div class="booking-step-num">${bookingState.step > i + 1 ? ICONS.check.replace('class="icon"', 'class="icon-sm"') : i + 1}</div><div class="booking-step-label">${s}</div></div>`).join("")}</div>${c}</div></div>`;
      }

      function renderBookingStep1() {
        const sv = store.state.services.filter((s) => s.active);
        const cats = [...new Set(sv.map((s) => s.category))];
        const cn = {
          consultation: "Консультации",
          therapy: "Лечение",
          hygiene: "Гигиена",
          surgery: "Хирургия",
          orthopedics: "Ортопедия",
          orthodontics: "Ортодонтия",
        };
        return `<div class="text-center mb-20"><h2 style="font-size:26px;font-weight:800;margin-bottom:8px">${t("book_select_service")}</h2></div>${cats
          .map(
            (c) =>
              `<div style="margin-bottom:28px"><div style="font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">${cn[c] || c}</div><div class="services-grid">${sv

                  (s) =>
                    `<div class="service-card ${bookingState.serviceId === s.id ? "selected" : ""}" style="${bookingState.serviceId === s.id ? "border-color:var(--accent);background:var(--accent-softer)" : ""}" onclick="bookingState.serviceId='${s.id}';bookingState.step=2;render()"><div class="service-card-head"><div class="service-card-icon">${ICONS[s.icon] || ICONS.tooth}</div><div class="service-card-duration">${s.duration} ${t("minutes")}</div></div><div class="service-card-name">${escapeHtml(locName(s.name))}</div><div class="service-card-desc">${escapeHtml(locName(s.description))}</div><div class="service-card-foot"><div class="service-card-price">${formatCurrency(s.price)}</div></div></div>`,
                )
                .join("")}</div></div>`,
          )
          .join("")}`;
      }

      function renderBookingStep2() {
        const s = store.state.services.find(
          (x) => x.id === bookingState.serviceId,
        );
        const el = store.state.employees.filter(
          (e) =>
            e.active && e.assignedServices.includes(bookingState.serviceId),
        );
        return `<div class="text-center mb-20"><h2 style="font-size:26px;font-weight:800;margin-bottom:8px">${t("book_select_doctor")}</h2><p class="text-muted">${escapeHtml(locName(s?.name))} · ${s?.duration} ${t("minutes")}</p></div><div class="doctors-grid"><div class="doctor-card" style="cursor:pointer;${bookingState.employeeId === "any" ? "border-color:var(--accent);background:var(--accent-softer)" : ""}" onclick="bookingState.employeeId='any';bookingState.step=3;render()"><div class="doctor-photo" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-subtle)">?</div><div class="doctor-info"><div class="doctor-name">${t("book_any_doctor")}</div></div></div>${el.map((d) => `<div class="doctor-card" style="cursor:pointer;${bookingState.employeeId === d.id ? "border-color:var(--accent);background:var(--accent-softer)" : ""}" onclick="bookingState.employeeId='${d.id}';bookingState.step=3;render()"><div class="doctor-photo"><img src="${d.photoUrl}" alt="${escapeHtml(d.name)}"/></div><div class="doctor-info"><div class="doctor-name">${escapeHtml(d.name)}</div><div class="doctor-spec">${escapeHtml(locName(d.specialty))}</div></div></div>`).join("")}</div><div style="margin-top:28px"><button class="btn" onclick="bookingState.step=1;render()">← ${t("book_back")}</button></div>`;
      }

      function renderBookingStep3() {
        const cur = bookingState.date
          ? new Date(bookingState.date)
          : new Date();
        const y = cur.getFullYear(),
          m = cur.getMonth();
        const first = new Date(y, m, 1);
        const off = (first.getDay() + 6) % 7;
        const dim = new Date(y, m + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < off; i++) {
          const d = new Date(y, m, -off + i + 1);
          cells.push({ date: d, other: true });
        }
        for (let i = 1; i <= dim; i++)
          cells.push({ date: new Date(y, m, i), other: false });
        while (cells.length % 7 !== 0 || cells.length < 42) {
          const l = cells[cells.length - 1].date;
          const d = new Date(l);
          d.setDate(d.getDate() + 1);
          cells.push({ date: d, other: true });
          if (cells.length >= 42) break;
        }
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const ms = {
          ru: [
            "Январь",
            "Февраль",
            "Март",
            "Апрель",
            "Май",
            "Июнь",
            "Июль",
            "Август",
            "Сентябрь",
            "Октябрь",
            "Ноябрь",
            "Декабрь",
          ],
          uz: [
            "Yanvar",
            "Fevral",
            "Mart",
            "Aprel",
            "May",
            "Iyun",
            "Iyul",
            "Avgust",
            "Sentabr",
            "Oktabr",
            "Noyabr",
            "Dekabr",
          ],
          en: [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December",
          ],
        };
        const lang = store.state.settings.language;
        let slots = "";
        if (bookingState.date) {
          let el = [];
          if (bookingState.employeeId === "any") {
            store.state.employees
              .filter(
                (e) =>
                  e.active &&
                  e.assignedServices.includes(bookingState.serviceId),
              )
              .forEach((e) => {
                getAvailableSlots(
                  e.id,
                  bookingState.serviceId,
                  new Date(bookingState.date).toISOString(),
                ).forEach((sl) => {
                  if (!el.find((x) => x.time === sl))
                    el.push({ time: sl, employeeId: e.id });
                });
              });
          } else {
            getAvailableSlots(
              bookingState.employeeId,
              bookingState.serviceId,
              new Date(bookingState.date).toISOString(),
            ).forEach((sl) => {
              el.push({ time: sl, employeeId: bookingState.employeeId });
            });
          }
          el.sort((a, b) => a.time - b.time);
          if (el.length === 0)
            slots = `<div class="empty-state"><div class="empty-state-icon">${ICONS.clock}</div><div>${t("book_no_slots")}</div></div>`;
          else
            slots = `<div class="time-slots">${el.map((s) => `<div class="time-slot ${bookingState.startTime === s.time && bookingState.employeeId === s.employeeId ? "selected" : ""}" onclick="bookingState.startTime=${s.time};bookingState.employeeId='${s.employeeId}';render()">${formatTime(s.time)}</div>`).join("")}</div>`;
        }
        return `<div class="text-center mb-20"><h2 style="font-size:26px;font-weight:800;margin-bottom:8px">${t("book_select_date")}</h2></div><div class="card" style="padding:24px;margin-bottom:20px"><div class="flex-between mb-16"><button class="btn btn-sm" onclick="bookingState.date=new Date(${y},${m - 1},1).toISOString();bookingState.startTime=null;render()">‹</button><div style="font-weight:700;font-size:16px">${ms[lang][m]} ${y}</div><button class="btn btn-sm" onclick="bookingState.date=new Date(${y},${m + 1},1).toISOString();bookingState.startTime=null;render()">›</button></div><div class="calendar-header-row" style="border:none;margin-bottom:6px;background:transparent">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map((d) => `<div class="calendar-header-cell">${d}</div>`).join("")}</div><div class="date-picker">${cells
          .map((c) => {
            const iso = c.date.toISOString().slice(0, 10);
            const past = c.date < today;
            const isT = c.date.getTime() === today.getTime();
            const sel =
              bookingState.date && bookingState.date.slice(0, 10) === iso;
            return `<div class="date-cell ${c.other ? "disabled" : ""} ${past ? "disabled" : ""} ${isT ? "today" : ""} ${sel ? "selected" : ""}" ${!c.other && !past ? `onclick="bookingState.date='${c.date.toISOString()}';bookingState.startTime=null;render()"` : ""}>${c.date.getDate()}</div>`;
          })
          .join(
            "",
          )}</div></div>${bookingState.date ? `<div class="card" style="padding:24px;margin-bottom:20px"><div class="card-title mb-12" style="font-weight:700">${t("book_select_time")}</div>${slots}</div>` : ""}<div style="display:flex;justify-content:space-between"><button class="btn" onclick="bookingState.step=2;render()">← ${t("book_back")}</button><button class="btn btn-primary" ${!bookingState.startTime ? 'disabled style="opacity:.5;pointer-events:none"' : ""} onclick="if(bookingState.startTime){bookingState.step=4;render()}">${t("book_next")} →</button></div>`;
      }

      function renderBookingStep4() {
        const s = store.state.services.find(
          (x) => x.id === bookingState.serviceId,
        );
        const e = store.state.employees.find(
          (x) => x.id === bookingState.employeeId,
        );

tton class="btn btn-primary btn-lg" onclick="confirmBooking()">${ICONS.check}<span>${t("book_confirm")}</span></button></div>`;
      }

      function confirmBooking() {
        const err = {};
        if (!bookingState.name.trim()) err.name = true;
        if (!bookingState.phone.trim()) err.phone = t("book_required");
        else if (!/^[+\d\s\-()]{7,}$/.test(bookingState.phone.trim()))
          err.phone = t("book_invalid_phone");
        if (Object.keys(err).length) {
          bookingState.errors = err;
          render();
          return;
        }
        const s = store.state.services.find(
          (x) => x.id === bookingState.serviceId,
        );
        if (
          hasConflict(
            bookingState.employeeId,
            bookingState.date,
            bookingState.startTime,
            s.duration,
            bookingState._rescheduleId,
          )
        ) {
          toast(t("book_conflict"), "error");
          bookingState.step = 3;
          render();
          return;
        }
        let c = store.state.customers.find(
          (x) => x.phone === bookingState.phone.trim(),
        );
        if (!c) {
          c = {
            id: uid(),
            name: bookingState.name.trim(),
            phone: bookingState.phone.trim(),
            notes: bookingState.notes,
            createdAt: new Date().toISOString(),
            allergies: "",
            diagnoses: "",
            teeth: {},
          };
          store.update((s) => s.customers.push(c));
        } else {
          store.update((s) => {
            const x = s.customers.find((y) => y.id === c.id);
            x.name = bookingState.name.trim();
            if (bookingState.notes) x.notes = bookingState.notes;
          });
        }
        const ref = refCode();
        store.update((s) => {
          if (bookingState._rescheduleId) {
            const a = s.appointments.find(
              (x) => x.id === bookingState._rescheduleId,
            );
            a.date = bookingState.date;
            a.startTime = bookingState.startTime;
            a.employeeId = bookingState.employeeId;
          } else {
            s.appointments.push({
              id: uid(),
              ref,
              customerId: c.id,
              employeeId: bookingState.employeeId,
              serviceId: bookingState.serviceId,
              date: bookingState.date,
              startTime: bookingState.startTime,
              status: "confirmed",
              createdAt: new Date().toISOString(),
            });
          }
        });
        bookingState.ref = bookingState._rescheduleId
          ? store.state.appointments.find(
              (x) => x.id === bookingState._rescheduleId,
            ).ref
          : ref;
        bookingState._rescheduleId = null;
        bookingState.errors = {};
        toast(t("book_success"));
        render();
      }

      function renderBookingConfirmation() {
        const a = store.state.appointments.find(

='week';render()">Неделя</button><button class="${apptViewState.view === "month" ? "active" : ""}" onclick="apptViewState.view='month';render()">Месяц</button><button class="${apptViewState.view === "list" ? "active" : ""}" onclick="apptViewState.view='list';render()">Список</button></div></div>${apptViewState.view === "list" ? renderListView(list) : `<div id="fullcalendar"></div>`}</div>`;
      }
      function calendarNavigate(d) {

            d *
              (apptViewState.view === "month"
                ? 30
                : apptViewState.view === "week"
                  ? 7
                  : 1),
          );
          render();
          return;

        else calendarInstance.prev();

        apptViewState.cursor = v.currentStart.toISOString();

          ru: [

            "Февраль",
            "Март",
            "Апрель",
            "Май",
            "Июнь",
            "Июль",
            "Август",
            "Сентябрь",
            "Октябрь",
            "Ноябрь",

            "Mart",
            "Aprel",
            "May",
            "Iyun",
            "Iyul",
            "Avgust",
            "Sentabr",
            "Oktabr",
            "Noyabr",
            "Dekabr",
          ],

            "January",
            "February",

      function renderFullCalendar(appts) {
        const vm = {
          month: "dayGridMonth",
          week: "timeGridWeek",
          day: "timeGridDay",
          list: "listWeek",
        };
        const iv = vm[apptViewState.view] || "dayGridMonth";
        const cur = new Date(apptViewState.cursor);
        const lang = store.state.settings.language;
        const u = store.state.auth.user;
        const canEdit = u.role !== "doctor";
        setTimeout(() => {
          const el = document.getElementById("calTitle");
          if (el) el.textContent = formatDateLong(apptViewState.cursor);
        }, 0);
        const events = appts.map((a) => {
          const sv = store.state.services.find((s) => s.id === a.serviceId);
          const dur = sv?.duration || 30;
          const st = new Date(a.date);
          st.setHours(Math.floor(a.startTime / 60), a.startTime % 60, 0, 0);
          const en = new Date(st.getTime() + dur * 60000);
          const cm = {
            pending: "#d97706",
            confirmed: "#0d9488",
            completed: "#16a34a",
            cancelled: "#9ca3af",
          };
          return {
            id: a.id,
            title: `${formatTime(a.startTime)} ${locName(sv?.name)}`,
            start: st.toISOString(),
            end: en.toISOString(),
            backgroundColor: cm[a.status],
            borderColor: cm[a.status],
            extendedProps: { appointmentId: a.id },
          };
        });
        if (calendarInstance) {
          calendarInstance.destroy();
          calendarInstance = null;
        }
        const el = document.getElementById("fullcalendar");
        if (!el) return "";
        calendarInstance = new FullCalendar.Calendar(el, {
          initialView: iv,
          initialDate: cur.toISOString(),
          locale: lang === "uz" ? "uz" : lang === "en" ? "en" : "ru",
          headerToolbar: false,
          editable: canEdit,
          eventStartEditable: canEdit,
          eventDurationEditable: canEdit,
          selectable: canEdit,
          selectMirror: true,
          dayMaxEvents: 3,
          nowIndicator: true,
          height: "auto",
          contentHeight: 600,
          events: events,
          eventClick: (info) => {
            openAppointmentDetails(info.event.extendedProps.appointmentId);
          },
          eventDrop: (info) => {
            const id = info.event.extendedProps.appointmentId;
            const ns = info.event.start;
            const nst = ns.getHours() * 60 + ns.getMinutes();
            const nd = ns.toISOString();
            const a = store.state.appointments.find((x) => x.id === id);
            if (!a) return;
            const sv = store.state.services.find((s) => s.id === a.serviceId);
            if (hasConflict(a.employeeId, nd, nst, sv?.duration || 30, id)) {
              toast(t("book_conflict"), "error");
              info.revert();
              return;
            }
            store.update((s) => {
              const x = s.appointments.find((y) => y.id === id);
              x.date = nd;
              x.startTime = nst;
            });
            toast(t("saved"));
          },
          select: (info) => {
            bookingState.step = 3;
            bookingState.date = info.start.toISOString();
            bookingState.startTime =
              info.start.getHours() * 60 + info.start.getMinutes();
            router.navigate("public", "booking");
          },
        });
        calendarInstance.render();
        return "";
      }

      function renderListView(appts) {

          .map((a) => {
            const c = store.state.customers.find((x) => x.id === a.customerId);
            const sv = store.state.services.find((x) => x.id === a.serviceId);
            const e = store.state.employees.find((x) => x.id === a.employeeId);
            return `<tr><td><code style="font-size:11px">${a.ref}</code></td><td>${formatDate(a.date)}</td><td>${formatTime(a.startTime)}</td><td>${escapeHtml(c?.name || "—")}</td><td>${escapeHtml(locName(sv?.name))}</td><td>${escapeHtml(e?.name || "—")}</td><td><span class="badge badge-${a.status}"><span class="badge-dot"></span>${t(a.status)}</span></td><td><button class="btn btn-sm" onclick="openAppointmentDetails('${a.id}')">${t("view")}</button></td></tr>`;

      }

          employeeId:

            "",
          serviceId: ex?.serviceId || "",
          customerId: ex?.customerId || "",
          date: ex
            ? new Date(ex.date).toISOString().slice(0, 10)
            : new Date().toISOString().slice(0, 10),
          startTime: ex?.startTime || 540,
          status: ex?.status || "confirmed",
          errors: {},
        };
        function rm() {
          const av =
            st.employeeId && st.serviceId
              ? getAvailableSlots(
                  st.employeeId,
                  st.serviceId,
                  new Date(st.date).toISOString(),
                )
              : [];
          const sv = s.services.find((x) => x.id === st.serviceId);
          const dur = sv?.duration || 30;
          openModal(
            `<div class="modal-header"><div class="modal-title">${ex ? t("edit") : t("dash_new_appt")}</div><button class="btn btn-ghost btn-sm" onclick="closeModal()">${ICONS.x}</button></div><div class="modal-body"><div class="form-group"><label class="form-label">${t("patient")} *</label><select class="form-select" id="appt-customer"><option value="">—</option>${s.customers.map((c) => `<option value="${c.id}" ${st.customerId === c.id ? "selected" : ""}>${escapeHtml(c.name)} · ${escapeHtml(c.phone)}</option>`).join("")}</select>${st.errors.customerId ? `<div class="form-error">${t("required")}</div>` : ""}</div><div class="form-group"><label class="form-label">${t("doctor")} *</label><select class="form-select" id="appt-employee" onchange="window._apptState.employeeId=this.value;window._renderApptModal()">${(u.role === "doctor" ? s.employees.filter((e) => e.id === u.employeeId) : s.employees.filter((e) => e.active)).map((e) => `<option value="${e.id}" ${st.employeeId === e.id ? "selected" : ""}>${escapeHtml(e.name)}</option>`).join("")}</select></div><div class="form-group"><label class="form-label">${t("service")} *</label><select class="form-select" id="appt-service" onchange="window._apptState.serviceId=this.value;window._renderApptModal()"><option value="">—</option>${s.services
              .filter((sv) => sv.active)
              .map(
                (sv) =>
                  `<option value="${sv.id}" ${st.serviceId === sv.id ? "selected" : ""}>${escapeHtml(locName(sv.name))} · ${sv.duration}${t("minutes")} · ${formatCurrency(sv.price)}</option>`,
              )
              .join(
                "",
              )}</select>${st.errors.serviceId ? `<div class="form-error">${t("required")}</div>` : ""}</div><div class="form-group"><label class="form-label">${t("date")} *</label><input type="date" class="form-input" id="appt-date" value="${st.date}" onchange="window._apptState.date=this.value;window._renderApptModal()"/></div><div class="form-group"><label class="form-label">${t("time")} *</label>${sv ? `<select class="form-select" id="appt-time">${av.length === 0 ? `<option value="">${t("book_no_slots")}</option>` : av.map((sl) => `<option value="${sl}" ${st.startTime === sl ? "selected" : ""}>${formatTime(sl)} — ${formatTime(sl + dur)}</option>`).join("")}</select>` : `<div class="text-muted text-sm">${t("book_select_service")}</div>`}</div><div class="form-group"><label class="form-label">${t("status")}</label><select class="form-select" id="appt-status"><option value="pending" ${st.status === "pending" ? "selected" : ""}>${t("pending")}</option><option value="confirmed" ${st.status === "confirmed" ? "selected" : ""}>${t("confirmed")}</option><option value="completed" ${st.status === "completed" ? "selected" : ""}>${t("completed")}</option><option value="cancelled" ${st.status === "cancelled" ? "selected" : ""}>${t("cancelled")}</option></select></div></div><div class="modal-footer"><button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="window._saveAppt('${ex?.id || ""}')">${ex ? t("save") : t("create")}</button></div>`,
          );
        }
        window._apptState = st;
        window._renderApptModal = rm;
        window._saveAppt = (exId) => {
          const cu = document.getElementById("appt-customer").value;
          const em = document.getElementById("appt-employee").value;
          const sv = document.getElementById("appt-service").value;
          const dt = document.getElementById("appt-date").value;
          const te = document.getElementById("appt-time");
          const st2 = te ? Number(te.value) : null;
          const st3 = document.getElementById("appt-status").value;
          const er = {};
          if (!cu) er.customerId = true;
          if (!sv) er.serviceId = true;
          if (Object.keys(er).length) {
            st.errors = er;
            rm();
            return;
          }
          const svs = s.services.find((x) => x.id === sv);
          if (
            hasConflict(
              em,
              new Date(dt).toISOString(),
              st2,
              svs.duration,
              exId || null,
            )
          ) {
            toast(t("book_conflict"), "error");
            return;
          }
          store.update((x) => {
            if (exId) {
              const a = x.appointments.find((y) => y.id === exId);
              Object.assign(a, {
                customerId: cu,
                employeeId: em,
                serviceId: sv,
                date: new Date(dt).toISOString(),
                startTime: st2,
                status: st3,
              });
            } else {
              x.appointments.push({
                id: uid(),
                ref: refCode(),
                customerId: cu,
                employeeId: em,
                serviceId: sv,
                date: new Date(dt).toISOString(),
                startTime: st2,
                status: st3,
                createdAt: new Date().toISOString(),
              });
            }
          });
          toast(t("saved"));
          closeModal();
          render();
        };
        rm();
      }

n></button>${canEdit ? `<button class="btn btn-danger" onclick="if(confirm(t('confirm_delete'))){store.update(s=>{s.appointments=s.appointments.filter(x=>x.id!=='${a.id}')});toast(t('deleted'));closeDrawer();render()}">${ICONS.x}<span>${t("delete")}</span></button>` : ""}</div></div>`,

      function saveCustomer(exId) {
        const n = document.getElementById("cust-name").value.trim();
        const p = document.getElementById("cust-phone").value.trim();
        const al = document.getElementById("cust-allergies").value.trim();
        const di = document.getElementById("cust-diagnoses").value.trim();
        const no = document.getElementById("cust-notes").value.trim();
        const er = document.getElementById("cust-errors");
        if (!n || !p) {
          er.innerHTML = `<div class="form-error">${t("required")}</div>`;
          return;
        }
        if (!/^[+\d\s\-()]{7,}$/.test(p)) {
          er.innerHTML = `<div class="form-error">${t("invalid_phone")}</div>`;
          return;
        }
        store.update((s) => {
          if (exId) {
            const c = s.customers.find((x) => x.id === exId);
            Object.assign(c, {
              name: n,
              phone: p,
              allergies: al,
              diagnoses: di,
              notes: no,
            });

            s.customers.push({
              id: uid(),
              name: n,
              phone: p,
              allergies: al,
              diagnoses: di,
              notes: no,
              createdAt: new Date().toISOString(),
              teeth: {},
            });
          }
        });
        toast(t("saved"));
        closeModal();
        render();

      function toggleToothStatus(cid, tn) {
        const st = [
          "",
          "healthy",
          "caries",
          "filled",
          "crown",
          "implant",
          "removed",
        ];
        store.update((s) => {
          const c = s.customers.find((x) => x.id === cid);
          if (!c.teeth) c.teeth = {};
          const cur = c.teeth[tn] || "";
          const idx = st.indexOf(cur);
          const next = st[(idx + 1) % st.length];
          if (next === "") delete c.teeth[tn];
          else c.teeth[tn] = next;
        });
        openCustomerDetails(cid);
        setTimeout(() => {
          const tabs = document.querySelectorAll(".drawer .tab");
          if (tabs[1]) tabs[1].click();
        }, 50);
      }

      function handlePhotoUpload(e) {
        const f = e.target.files[0];
        if (!f) return;
        if (f.size > 2 * 1024 * 1024) {
          toast("Файл слишком большой (макс. 2MB)", "error");
          return;
        }
        const r = new FileReader();
        r.onload = (ev) => {
          window._tempPhotoUrl = ev.target.result;
          const pv = document.getElementById("photo-preview");
          if (pv) pv.innerHTML = `<img src="${ev.target.result}" alt=""/>`;
        };
        r.readAsDataURL(f);
      }

                      .join(
                        "",
                      )}</div><span class="badge badge-${r.status === "approved" ? "approved" : r.status === "rejected" ? "rejected" : "pending"}"><span class="badge-dot"></span>${t(r.status)}</span></div></div><div style="padding:12px 16px;background:var(--surface);border-radius:var(--radius);font-style:italic;margin-bottom:12px">"${escapeHtml(r.text)}"</div><div class="flex gap-8" style="justify-content:flex-end;flex-wrap:wrap">${r.status === "pending" ? `<button class="btn btn-sm btn-primary" onclick="moderateReview('${r.id}','approved')">${ICONS.check}<span>${t("approve")}</span></button><button class="btn btn-sm btn-danger" onclick="moderateReview('${r.id}','rejected')">${ICONS.x}<span>${t("reject")}</span></button>` : `<button class="btn btn-sm" onclick="moderateReview('${r.id}','pending')">${ICONS.activity}<span>Вернуть</span></button>`}</div></div>`,
                )
                .join("")}</div>`
        }</div>`;
      }
      function moderateReview(id, st) {
        store.update((s) => {
          const r = s.reviews.find((x) => x.id === id);
          if (r) r.status = st;
        });
        toast(t("saved"));
        render();
      }

      function renderFinanceAdmin() {
        const s = store.state;
        const ms = new Date();
        ms.setDate(1);
        ms.setHours(0, 0, 0, 0);
        const mt = s.transactions.filter((t) => new Date(t.date) >= ms);
        const inc = mt
          .filter((t) => t.type === "income")
          .reduce((sum, t) => sum + t.amount, 0);
        const exp = mt
          .filter((t) => t.type === "expense")
          .reduce((sum, t) => sum + t.amount, 0);
        const comp = s.appointments.filter((a) => a.status === "completed");
        const avg =
          comp.length > 0
            ? comp.reduce(
                (sum, a) =>
                  sum +
                  (s.services.find((sv) => sv.id === a.serviceId)?.price || 0),
                0,
              ) / comp.length
            : 0;
        const byS = {};
        comp.forEach((a) => {
          const sv = s.services.find((x) => x.id === a.serviceId);
          if (!sv) return;
          const n = locName(sv.name);
          byS[n] = (byS[n] || 0) + sv.price;
        });
        const bySA = Object.entries(byS)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);
        const mx = Math.max(1, ...bySA.map((x) => x[1]));
        return `<div class="content"><div class="stats-grid"><div class="stat"><div class="stat-head"><div class="stat-label">${t("fin_income")}</div><div class="stat-icon" style="background:var(--success-soft);color:var(--success)">${ICONS.dollar}</div></div><div class="stat-value" style="font-size:20px">${formatCurrency(inc)}</div></div><div class="stat"><div class="stat-head"><div class="stat-label">${t("fin_expense")}</div><div class="stat-icon" style="background:var(--danger-soft);color:var(--danger)">${ICONS.dollar}</div></div><div class="stat-value" style="font-size:20px">${formatCurrency(exp)}</div></div><div class="stat"><div class="stat-head"><div class="stat-label">${t("fin_profit")}</div><div class="stat-icon">${ICONS.chart}</div></div><div class="stat-value" style="font-size:20px">${formatCurrency(inc - exp)}</div></div><div class="stat"><div class="stat-head"><div class="stat-label">${t("fin_avg_check")}</div><div class="stat-icon">${ICONS.dollar}</div></div><div class="stat-value" style="font-size:20px">${formatCurrency(avg)}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="finance-grid"><div class="card"><div class="card-header"><div class="card-title">${t("fin_by_service")}</div></div><div class="card-body">${bySA.length === 0 ? `<div class="text-muted text-sm">${t("no_data")}</div>` : `<div style="display:flex;flex-direction:column;gap:12px">${bySA.map(([n, a]) => `<div><div class="flex-between" style="margin-bottom:4px"><span class="text-sm fw-600">${escapeHtml(n)}</span><span class="text-sm">${formatCurrency(a)}</span></div><div style="height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(a / mx) * 100}%;background:var(--accent);border-radius:3px"></div></div></div>`).join("")}</div>`}</div></div><div class="card"><div class="card-header"><div class="card-title">Операции</div><button class="btn btn-sm btn-primary" onclick="openTransactionModal()">${ICONS.plus}</button></div><div style="max-height:500px;overflow-y:auto"><div class="table-wrapper"><table><tbody>${[
          ...s.transactions,
        ]
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .slice(0, 20)
          .map(
            (tx) =>
              `<tr><td><div style="font-weight:500;font-size:13px">${escapeHtml(tx.comment)}</div><div class="text-xs text-muted">${formatDate(tx.date)}</div></td><td style="text-align:right;font-weight:600;color:${tx.type === "income" ? "var(--success)" : "var(--danger)"}">${tx.type === "income" ? "+" : "−"}${formatCurrency(tx.amount)}</td></tr>`,
          )
          .join(
            "",
          )}</tbody></table></div></div></div></div></div><style>@media(max-width:900px){.finance-grid{grid-template-columns:1fr !important}}</style>`;
      }
      function openTransactionModal() {
        openModal(
          `<div class="modal-header"><div class="modal-title">${t("fin_add_transaction")}</div><button class="btn btn-ghost btn-sm" onclick="closeModal()">${ICONS.x}</button></div><div class="modal-body"><div class="form-group"><label class="form-label">${t("fin_type")}</label><select class="form-select" id="tx-type"><option value="income">${t("fin_income")}</option><option value="expense">${t("fin_expense")}</option></select></div><div class="form-group"><label class="form-label">${t("fin_amount")} *</label><input type="number" class="form-input" id="tx-amount" min="0"/></div><div class="form-group"><label class="form-label">${t("fin_comment")}</label><input class="form-input" id="tx-comment"/></div><div id="tx-errors"></div></div><div class="modal-footer"><button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="saveTransaction()">${t("save")}</button></div>`,
        );
      }
      function saveTransaction() {
        const t = document.getElementById("tx-type").value;
        const a = Number(document.getElementById("tx-amount").value);
        const c = document.getElementById("tx-comment").value.trim();
        if (!a || a <= 0) {
          document.getElementById("tx-errors").innerHTML =
            `<div class="form-error">${t("required")}</div>`;
          return;
        }
        store.update((s) => {
          s.transactions.push({
            id: uid(),
            type: t,
            amount: a,
            date: new Date().toISOString(),
            comment: c,
          });
        });
        toast(t("saved"));
        closeModal();
        render();
      }

      function renderWarehouseAdmin() {
        const s = store.state;
        return `<div class="content"><div class="filters" style="justify-content:flex-end"><button class="btn btn-primary" onclick="openWarehouseModal()">${ICONS.plus}<span>${t("wh_add_item")}</span></button></div>${s.warehouse.length === 0 ? `<div class="empty-state"><div class="empty-state-icon">${ICONS.box}</div><div>${t("no_data")}</div></div>` : `<div class="card"><div class="table-wrapper"><table><thead><tr><th>${t("name")}</th><th>${t("wh_stock")}</th><th>${t("wh_min")}</th><th>${t("status")}</th></tr></thead><tbody>${s.warehouse.map((w) => `<tr><td style="font-weight:600">${escapeHtml(w.name)}</td><td>${w.stock}</td><td>${w.min}</td><td>${w.stock < w.min ? `<span class="badge badge-cancelled"><span class="badge-dot"></span>${t("wh_low_stock")}</span>` : `<span class="badge badge-active">${t("active")}</span>`}</td></tr>`).join("")}</tbody></table></div></div>`}</div>`;
      }
      function openWarehouseModal(exId = null) {
        const s = store.state;
        const ex = exId ? s.warehouse.find((w) => w.id === exId) : null;
        openModal(
          `<div class="modal-header"><div class="modal-title">${ex ? t("edit") : t("wh_add_item")}</div><button class="btn btn-ghost btn-sm" onclick="closeModal()">${ICONS.x}</button></div><div class="modal-body"><div class="form-group"><label class="form-label">${t("name")} *</label><input class="form-input" id="wh-name" value="${escapeHtml(ex?.name || "")}"/></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label class="form-label">${t("wh_stock")} *</label><input type="number" class="form-input" id="wh-stock" value="${ex?.stock || 0}" min="0"/></div><div class="form-group"><label class="form-label">${t("wh_min")}</label><input type="number" class="form-input" id="wh-min" value="${ex?.min || 10}" min="0"/></div></div><div id="wh-errors"></div></div><div class="modal-footer">${ex ? `<button class="btn btn-danger" onclick="if(confirm(t('confirm_delete'))){store.update(s=>{s.warehouse=s.warehouse.filter(x=>x.id!=='${ex.id}')});toast(t('deleted'));closeModal();render()}">${t("delete")}</button>` : ""}<button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="saveWarehouseItem('${ex?.id || ""}')">${t("save")}</button></div>`,
        );
      }
      function saveWarehouseItem(exId) {
        const n = document.getElementById("wh-name").value.trim();
        const st = Number(document.getElementById("wh-stock").value);
        const mn = Number(document.getElementById("wh-min").value);
        if (!n) {
          document.getElementById("wh-errors").innerHTML =
            `<div class="form-error">${t("required")}</div>`;
          return;
        }
        store.update((s) => {
          if (exId) {
            const w = s.warehouse.find((x) => x.id === exId);
            Object.assign(w, { name: n, stock: st, min: mn });
          } else {
            s.warehouse.push({
              id: uid(),
              name: n,
              stock: st,
              min: mn,
              unit: "шт",
            });
          }
        });
        toast(t("saved"));
        closeModal();
        render();
      }

      function renderSettingsAdmin() {
        const b = store.state.business;
        const s = store.state.settings;
        return `<div class="content" style="max-width:800px"><div class="card mb-16"><div class="card-header"><div class="card-title">Клиника</div></div><div class="card-body"><div class="form-group"><label class="form-label">Название</label><input class="form-input" id="set-name" value="${escapeHtml(b.name)}"/></div><div class="form-group"><label class="form-label">Адрес</label><input class="form-input" id="set-address" value="${escapeHtml(b.address)}"/></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label class="form-label">Телефон</label><input class="form-input" id="set-phone" value="${escapeHtml(b.phone)}"/></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="set-email" value="${escapeHtml(b.email)}"/></div></div></div></div><div class="card mb-16"><div class="card-header"><div class="card-title">Настройки</div></div><div class="card-body"><div class="form-group"><label class="form-label">Валюта</label><select class="form-select" id="set-currency" style="max-width:200px"><option value="UZS" ${s.currency === "UZS" ? "selected" : ""}>UZS</option><option value="USD" ${s.currency === "USD" ? "selected" : ""}>USD</option></select></div><div class="form-group"><label class="form-label">Язык</label><select class="form-select" id="set-language" style="max-width:200px"><option value="ru" ${s.language === "ru" ? "selected" : ""}>Русский</option><option value="uz" ${s.language === "uz" ? "selected" : ""}>O'zbek</option><option value="en" ${s.language === "en" ? "selected" : ""}>English</option></select></div><div class="form-group"><label class="form-label">Тема</label><div class="flex gap-8"><button class="btn ${s.theme === "light" ? "btn-primary" : ""}" onclick="store.update(st=>{st.settings.theme='light';document.documentElement.setAttribute('data-theme','light');render()})">${ICONS.sun}<span>Светлая</span></button><button class="btn ${s.theme === "dark" ? "btn-primary" : ""}" onclick="store.update(st=>{st.settings.theme='dark';document.documentElement.setAttribute('data-theme','dark');render()})">${ICONS.moon}<span>Тёмная</span></button></div></div></div></div><div class="flex gap-8" style="justify-content:flex-end"><button class="btn btn-danger" onclick="if(confirm(t('reset_confirm'))){store.reset();toast('Demo reset')}">${t("reset_demo")}</button><button class="btn btn-primary" onclick="saveSettings()">${t("save")}</button></div></div>`;
      }
      function saveSettings() {
        store.update((s) => {
          s.business.name = document.getElementById("set-name").value;
          s.business.address = document.getElementById("set-address").value;
          s.business.phone = document.getElementById("set-phone").value;
          s.business.email = document.getElementById("set-email").value;
          s.settings.currency = document.getElementById("set-currency").value;
          s.settings.language = document.getElementById("set-language").value;
        });
        toast(t("saved"));
        render();
      }

      function initMap() {
        const el = document.getElementById("map");
        if (!el || el._leaflet_id) return;
        const m = L.map("map").setView([41.311081, 69.279737], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap",
          maxZoom: 19,
        }).addTo(m);
        const ic = L.divIcon({
          className: "custom-marker",
          html: `<div style="background:var(--accent);width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center"><div style="transform:rotate(45deg);color:white;font-size:14px">🦷</div></div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 32],
        });
        L.marker([41.311081, 69.279737], { icon: ic })
          .addTo(m)
          .bindPopup(
            `<div style="font-weight:600;margin-bottom:4px">${escapeHtml(store.state.business.name)}</div><div style="font-size:12px;color:#666">${escapeHtml(store.state.business.address)}</div>`,
          )
          .openPopup();
        setTimeout(() => m.invalidateSize(), 100);
      }

      function render() {
        const r = document.getElementById("root");
        if (router.app === "public") {
          r.innerHTML = renderPublicPage();
          if (router.page === "contacts") setTimeout(initMap, 50);
        } else {
          if (!store.state.auth.user) {
            r.innerHTML = renderAdminLogin();
          } else {
            const u = store.state.auth.user;
            if (!canAccess(router.page)) router.page = "dashboard";
            let p = "";
            if (router.page === "dashboard") p = renderDashboard();
            else if (router.page === "appointments")
              p = renderAppointmentsAdmin();
            else if (router.page === "patients") p = renderPatientsAdmin();
            else if (router.page === "services" && u.role === "admin")
              p = renderServicesAdmin();
            else if (router.page === "team" && u.role === "admin")
              p = renderTeamAdmin();
            else if (router.page === "reviews" && u.role === "admin")
              p = renderReviewsModeration();
            else if (router.page === "finance" && u.role === "admin")
              p = renderFinanceAdmin();
            else if (router.page === "warehouse" && u.role === "admin")
              p = renderWarehouseAdmin();
            else if (router.page === "settings" && u.role === "admin")
              p = renderSettingsAdmin();
            r.innerHTML = `<div class="app">${renderAdminSidebar()}<div class="main">${renderAdminTopbar()}${p}</div></div><div class="switch-demo"><button class="${router.app === "public" ? "active" : ""}" onclick="router.navigate('public','home')">Сайт</button><button class="${router.app === "admin" ? "active" : ""}" onclick="router.navigate('admin','dashboard')">Админ</button></div>`;
            if (
              router.page === "appointments" &&
              apptViewState.view !== "list"
            ) {
              const s = store.state;
              let l = getFilteredAppointments();
              if (apptViewState.filterStatus !== "all")
                l = l.filter((a) => a.status === apptViewState.filterStatus);
              if (u.role !== "doctor" && apptViewState.filterEmployee !== "all")
                l = l.filter(
                  (a) => a.employeeId === apptViewState.filterEmployee,
                );
              setTimeout(() => renderFullCalendar(l), 50);
            }
          }
        }
      }

      store.init();
      render();
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeModal();
          closeDrawer();
        }
      });
    </script>
  </body>
</html>
